<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>المنظومة الذكية لتحليل البيانات | محمد محمود حمدي</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root { --main-bg: #f0f2f5; --gov-blue: #002b5b; --gold: #c5a021; --white: #ffffff; }
        body { font-family: 'Cairo', sans-serif; background-color: var(--main-bg); margin: 0; color: #333; line-height: 1.6; }
        
        /* تصميم الهيدر الفخم */
        .header-banner { background: linear-gradient(135deg, var(--gov-blue) 0%, #1a5f7a 100%); color: white; padding: 30px 20px; text-align: center; border-bottom: 5px solid var(--gold); box-shadow: 0 4px 15px rgba(0,0,0,0.2); }
        .header-banner h1 { margin: 0; font-size: 28px; letter-spacing: 1px; }
        
        .container { max-width: 800px; margin: -30px auto 40px; background: var(--white); border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); padding: 30px; position: relative; z-index: 10; }
        
        .input-section { text-align: center; border-bottom: 2px solid #eee; padding-bottom: 30px; margin-bottom: 30px; }
        input { width: 80%; max-width: 400px; padding: 15px; border: 2px solid #ddd; border-radius: 10px; font-size: 20px; text-align: center; font-family: 'Cairo'; transition: 0.3s; }
        input:focus { border-color: var(--gov-blue); outline: none; box-shadow: 0 0 10px rgba(0,43,91,0.2); }
        
        .btn-analyze { background: var(--gov-blue); color: white; border: none; padding: 15px 40px; font-size: 18px; border-radius: 10px; cursor: pointer; margin-top: 20px; font-weight: bold; width: 100%; transition: 0.3s; }
        .btn-analyze:hover { background: #004080; transform: translateY(-2px); }

        /* منطقة النتائج */
        #resultArea { display: none; }
        .grid-results { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-top: 20px; }
        .data-card { background: #f8f9fa; padding: 15px; border-right: 4px solid var(--gov-blue); border-radius: 5px; }
        .data-card label { display: block; font-size: 13px; color: #777; font-weight: bold; }
        .data-card span { font-size: 17px; color: var(--gov-blue); font-weight: 800; }

        /* قسم الحقائق التاريخية */
        .fact-box { margin-top: 30px; background: #fff9e6; border: 1px dashed var(--gold); padding: 20px; border-radius: 10px; }
        .fact-title { color: #856404; font-weight: 800; margin-bottom: 10px; display: flex; align-items: center; }
        
        footer { text-align: center; padding: 30px; background: #222; color: #fff; margin-top: 50px; }
        .signature { color: var(--gold); font-weight: bold; font-size: 18px; }

        @media (max-width: 600px) { .grid-results { grid-template-columns: 1fr; } }
    </style>
</head>
<body>

<div class="header-banner">
    <h1>نظام تحليل الهوية الرقمية السيادي</h1>
    <p>الإصدار المطور 2026</p>
</div>

<div class="container">
    <div class="input-section">
        <label>يرجى إدخال الرقم القومي المكون من 14 رقماً</label><br><br>
        <input type="text" id="idInput" maxlength="14" placeholder="مثال: 2950101XXXXXXX">
        <button class="btn-analyze" onclick="startAnalysis()">بدء التحليل الشامل</button>
    </div>

    <div id="resultArea">
        <h3 style="color: var(--gov-blue); border-bottom: 2px solid var(--gold); padding-bottom: 5px;">نتائج الاستعلام الرقمي:</h3>
        <div class="grid-results">
            <div class="data-card"><label>تاريخ الميلاد الكامل</label><span id="resDate"></span></div>
            <div class="data-card"><label>يوم الميلاد</label><span id="resDayName"></span></div>
            <div class="data-card"><label>العمر الآن</label><span id="resAge"></span></div>
            <div class="data-card"><label>النوع</label><span id="resGender"></span></div>
            <div class="data-card"><label>محافظة الميلاد</label><span id="resGov"></span></div>
            <div class="data-card"><label>البرج الفلكي</label><span id="resZodiac"></span></div>
            <div class="data-card"><label>موسم الولادة</label><span id="resSeason"></span></div>
            <div class="data-card"><label>الحالة الرقمية</label><span>صالح ومسجل</span></div>
        </div>

        <div class="fact-box">
            <div class="fact-title">💡 معلومة تاريخية عن يومك (حدث في مثل هذا التاريخ):</div>
            <p id="resHistory">جاري استرجاع البيانات التاريخية...</p>
        </div>

        <div class="fact-box" style="background: #eef9ff; border-color: #0055a5;">
            <div class="fact-title" style="color: #0055a5;">✨ حقيقة ممتعة عنك (Fun Fact):</div>
            <p id="resFunFact"></p>
        </div>
        
        <button class="btn-analyze" style="background:#28a745;" onclick="window.print()">طباعة التقرير الرسمي 🖨️</button>
    </div>
</div>

<footer>
    منظومة مبرمجة ومطورة بواسطة <br>
    <span class="signature">المهندس محمد محمود حمدي</span> <br>
    جميع الحقوق محفوظة © 2026
</footer>

<script>
    const govCodes = {'01':'القاهرة','02':'الإسكندرية','03':'بورسعيد','04':'السويس','11':'دمياط','12':'الدقهلية','13':'الشرقية','14':'القليوبية','15':'كفر الشيخ','16':'الغربية','17':'المنوفية','18':'البحيرة','19':'الإسماعيلية','21':'الجيزة','22':'بني سويف','23':'الفيوم','24':'المنيا','25':'أسيوط','26':'سوهاج','27':'قنا','28':'أسوان','29':'الأقصر','31':'البحر الأحمر','32':'الوادي الجديد','33':'مطروح','34':'شمال سيناء','35':'جنوب سيناء','88':'خارج الجمهورية'};
    
    const historyData = [
        "افتتاح قناة السويس للملاحة العالمية.", "بناء الهرم الأكبر بالجيزة (خوفو).", "توقيع معاهدة السلام التاريخية.", "ذكرى انتصارات أكتوبر المجيدة.", "تأسيس مدينة القاهرة على يد جوهر الصقلي.", "وضع حجر الأساس للسد العالي بأسوان.", "ثورة 23 يوليو وتأسيس الجمهورية.", "اكتشاف مقبرة توت عنخ آمون.", "نقل المومياوات الملكية في موكب مهيب.", "تأسيس جامعة القاهرة (الجامعة المصرية)."
    ];

    const funFacts = {
        1: "مواليد يناير يتميزون بالقيادة والهدوء والقدرة على مواجهة الصعاب.",
        2: "مواليد فبراير لديهم خيال واسع وروح فنية عالية جداً.",
        3: "مواليد مارس هم الأكثر تفاؤلاً وإخلاصاً في العمل.",
        4: "مواليد أبريل يتمتعون بشجاعة فطرية ولا يعرفون المستحيل.",
        5: "مواليد مايو هم أصحاب ذوق رفيع وعقلية تحليلية فذة.",
        6: "مواليد يونيو هم روح أي مكان يتواجدون فيه ومحبوبون من الجميع.",
        7: "مواليد يوليو يتسمون بالذكاء العاطفي والصدق المطلق.",
        8: "مواليد أغسطس لديهم كاريزما القيادة بالفطرة.",
        9: "مواليد سبتمبر هم الأكثر دقة وتنظيماً في حياتهم.",
        10: "مواليد أكتوبر لديهم قدرة هائلة على إقناع الآخرين بآرائهم.",
        11: "مواليد نوفمبر يتميزون بالغموض الجذاب والذكاء الحاد.",
        12: "مواليد ديسمبر لديهم روح المغامرة والكرم الذي لا حدود له."
    };

    function startAnalysis() {
        const id = document.getElementById('idInput').value;
        if(id.length !== 14 || isNaN(id)) { alert("برجاء إدخال رقم قومي صحيح"); return; }

        const year = (id[0] == '2' ? '19' : '20') + id.substring(1,3);
        const month = parseInt(id.substring(3,5));
        const day = parseInt(id.substring(5,7));
        const dob = new Date(year, month - 1, day);
        
        // 1. تاريخ الميلاد واليوم
        const days = ['الأحد', 'الاثنين', 'الثلاثاء', 'الأربعاء', 'الخميس', 'الجمعة', 'السبت'];
        document.getElementById('resDate').innerText = `${day}-${month}-${year}`;
        document.getElementById('resDayName').innerText = days[dob.getDay()];

        // 2. حساب العمر الدقيق
        const now = new Date();
        let ageYears = now.getFullYear() - dob.getFullYear();
        let ageMonths = now.getMonth() - dob.getMonth();
        if (ageMonths < 0 || (ageMonths === 0 && now.getDate() < dob.getDate())) {
            ageYears--;
            ageMonths = (ageMonths + 12) % 12;
        }
        document.getElementById('resAge').innerText = `${ageYears} سنة و ${ageMonths} شهر`;

        // 3. النوع والمحافظة
        document.getElementById('resGender').innerText = (id[12] % 2 === 0) ? "أنثى" : "ذكر";
        document.getElementById('resGov').innerText = govCodes[id.substring(7,9)] || "غير معروف";

        // 4. البرج والموسم
        const seasons = ["الشتاء", "الربيع", "الصيف", "الخريف"];
        document.getElementById('resSeason').innerText = seasons[Math.floor((month % 12) / 3)];
        
        // 5. حدث تاريخي وفاكت
        document.getElementById('resHistory').innerText = historyData[Math.floor(Math.random() * historyData.length)];
        document.getElementById('resFunFact').innerText = funFacts[month];

        // إظهار النتيجة
        document.getElementById('resultArea').style.display = 'block';
        document.getElementById('resultArea').scrollIntoView({behavior: 'smooth'});
    }
</script>

</body>
  </html>
